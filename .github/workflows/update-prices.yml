name: Actualizar precios

on:
  schedule:
    # Lunes a viernes, 18:10 y 22:10 UTC (12:10 y 16:10 hora CDMX), después del cierre oficial LME
    - cron: "10 18 * * 1-5"
    - cron: "10 22 * * 1-5"
  workflow_dispatch: {}   # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]      # al subir cambios a la app, se vuelve a publicar

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: metales
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar precios y enviar alertas
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/update_prices.py
      - name: Guardar cambios
        run: |
          git config user.name "metales-bot"
          git config user.email "metales-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "Precios $(date -u +%F)"
          git push

  # Publica la app con los precios recién guardados (no depende de que GitHub Pages detecte el commit)
  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages
        uses: actions/deploy-pages@v4
